<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SachMei — Fact Checker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>
      <div class="popup-header-text">
        <span class="popup-brand">SachMei</span>
        <span class="popup-version">v1.0</span>
      </div>
      <div class="popup-toggle-wrap">
        <label class="popup-toggle" for="toggle-enabled" title="Enable/Disable fact-checking">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="popup-toggle-track"></span>
        </label>
      </div>
    </header>

    <!-- Status Section -->
    <section class="popup-section popup-status-section" id="status-section">
      <div class="status-card" id="status-card">
        <div class="status-indicator" id="status-indicator"></div>
        <div class="status-content">
          <span class="status-title" id="status-title">Not on a YouTube video</span>
          <span class="status-subtitle" id="status-subtitle">Navigate to a YouTube video to begin</span>
        </div>
      </div>
    </section>

    <!-- Stats Section -->
    <section class="popup-section popup-stats-section" id="stats-section" hidden>
      <div class="popup-stats-grid">
        <div class="stat-item">
          <span class="stat-value" id="stat-segments">—</span>
          <span class="stat-label">Transcript<br>Segments</span>
        </div>
        <div class="stat-item stat-divider">
          <span class="stat-value" id="stat-checks">—</span>
          <span class="stat-label">Claims<br>Checked</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="stat-cache">—</span>
          <span class="stat-label">Cache<br>Hit Rate</span>
        </div>
      </div>
    </section>

    <!-- Provider Section -->
    <section class="popup-section">
      <label class="popup-label">Fact-Check Provider</label>
      <div class="popup-select-wrap">
        <select class="popup-select" id="provider-select">
          <option value="mock">🧪 Mock (Demo — No API key needed)</option>
          <option value="gemini">✨ Gemini (Google AI)</option>
        </select>
      </div>
      <div id="api-key-section" class="popup-api-key-section" hidden>
        <input type="password" class="popup-input" id="gemini-api-key" placeholder="Enter Gemini API key...">
        <button class="popup-btn-save" id="save-api-key">Save Key</button>
      </div>
    </section>

    <!-- Actions -->
    <section class="popup-section popup-actions">
      <button class="popup-btn-secondary" id="btn-clear-cache">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
        Clear Cache
      </button>
      <a class="popup-btn-secondary" href="../options/options.html" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"></path>
        </svg>
        Settings
      </a>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>SachMei · AI Fact Checker</span>
      <span class="popup-footer-shortcut">Alt+S to toggle panel</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
